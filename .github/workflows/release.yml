name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    env:
      UPDATE_KEY: ${{ secrets.MANDARINA_UPDATE_KEY }}
    steps:
      # Pinned to commit SHAs: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: ./build.sh

      - name: Package DMG
        run: ./scripts/make-dmg.sh

      # The app verifies this before installing anything. Without the secret
      # the release ships checksum-only, and the updater asks before installing.
      - name: Sign the release digest
        if: env.UPDATE_KEY != ''
        run: |
          DMG=$(ls dist/*.dmg)
          printf '%s' "$(shasum -a 256 "$DMG" | awk '{print $1}')" > "$RUNNER_TEMP/digest.txt"
          MANDARINA_UPDATE_KEY="$UPDATE_KEY" \
            swift Tools/sign-release.swift "$RUNNER_TEMP/digest.txt" > "$DMG.sig"
          echo "signed $DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mandarina-dmg
          path: |
            dist/*.dmg
            dist/*.sig

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.dmg.sig
          generate_release_notes: true
